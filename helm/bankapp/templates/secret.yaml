{{- if .Values.db.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.secretName }}
type: Opaque
stringData:
  # Replace the placeholder values before applying or use external secret management
  MYSQL_DATABASE: "db_name_here"
  MYSQL_USER: "db_user_here"
  MYSQL_PASSWORD: "change_me"
{{- end }}
