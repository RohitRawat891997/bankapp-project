<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <style>
    .box { fill:#f8f9fa; stroke:#2b6cb0; stroke-width:2; rx:8; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#1a202c; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size:18px; font-weight:700; fill:#2b6cb0; }
    .small { font-size:12px; fill:#2d3748; }
    .arrow { stroke:#2b6cb0; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- AWS Region outer box -->
  <rect x="40" y="20" width="920" height="560" class="box" />
  <text x="60" y="46" class="title">AWS Region</text>

  <!-- VPC box -->
  <rect x="80" y="80" width="840" height="380" class="box" />
  <text x="100" y="108" class="label">VPC (10.0.0.0/16)</text>

  <!-- Public Subnet -->
  <rect x="120" y="140" width="360" height="220" class="box" />
  <text x="140" y="168" class="label">Public Subnet (10.0.1.0/24)</text>

  <!-- EC2 Instance box -->
  <rect x="160" y="204" width="280" height="120" class="box" />
  <text x="180" y="232" class="label">EC2 Instance</text>
  <text x="180" y="252" class="small">- Application server</text>
  <text x="180" y="270" class="small">- IAM Role</text>
  <text x="180" y="288" class="small">- Security Group</text>

  <!-- Internet Gateway -->
  <rect x="520" y="300" width="260" height="80" class="box" />
  <text x="540" y="328" class="label">Internet Gateway</text>
  <text x="540" y="346" class="small">(Gateway to Internet)</text>

  <!-- Arrows from EC2 to IGW -->
  <path d="M440 264 L520 340" class="arrow" />

  <!-- Arrow down to Laptop area -->
  <path d="M520 460 L520 520" class="arrow" />

  <!-- Laptop / Your Laptop box outside region -->
  <rect x="420" y="520" width="300" height="100" class="box" />
  <text x="440" y="548" class="label">Your Laptop (103.181.90.188/32)</text>
  <text x="440" y="568" class="small">- SSH Port 22</text>
  <text x="440" y="588" class="small">- HTTP Port 8080</text>

  <!-- Arrow from Laptop to EC2 (dashed) -->
  <path d="M440 520 L360 360" stroke="#718096" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowhead)" />

  <!-- Decorative small notes -->
  <text x="120" y="460" class="small">Public Subnet routes traffic to Internet Gateway</text>

  <!-- Footer note -->
  <text x="60" y="650" class="small">Diagram: VPC → Public Subnet → EC2 (with IAM Role & Security Group) and Internet Gateway; access from laptop restricted to specific IP/ports.</text>
</svg>
